# concrete task list: parse KIRA_PEERS, start a RaftNode per instance, bind
# port 7379 to the Raft transport, route committed entries into the same
# TieredStorageEngine each node already has). Uncomment and run with:
#   docker compose --profile cluster up
# to see the intended topology — today it just gives you three independent
# nodes with no data consistency guarantees between them, so don't use this
