# docker-compose.yml — KiraDB local development
#
# WHAT'S REAL TODAY vs ASPIRATIONAL
# ----------------------------------
# KiraDBServer.main() (kiradb-server/src/main/java/io/kiradb/server/KiraDBServer.java)
# boots a single, standalone node: one TieredStorageEngine, one CrdtStore, one
# RESP3 listener on 6379, one HTTP API on 8080. It does NOT start a Raft
# instance, does NOT read KIRA_PEERS, and does NOT gossip CRDT state to other
# processes. Raft itself is implemented and tested (see kiradb-raft's test
# suite and docs/internals/raft-manual-test.md) but nothing in the server's
# bootstrap path wires it up — there is no cluster today, just multiple
# independent single-node instances that happen to run side by side.
#
# The `kiradb` service below is the one thing this file can honestly claim:
# a single working node you can point a Redis client at. The `kiradb-cluster`
# profile underneath it is the CLAUDE.md Phase 12 plan's 3-node layout,
# included so the intended shape is visible — but running it today gives you
# three UNCOORDINATED single-node instances, not a Raft cluster. Don't rely
# on KIRA_NODE_ID / KIRA_PEERS for real clustering; KIRA_NODE_ID only feeds
# CrdtStore's node id (see kiradb.node.id below) and KIRA_PEERS is accepted
# by nothing in this codebase yet. Tracked as a real gap in
# docs/internals/phase12-golive.md → "How to make this better".

services:
  kiradb:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: kiradb/kiradb:latest
    ports:
      - "6379:6379"   # RESP3 — redis-cli, Jedis, any Redis client
      - "8080:8080"   # HTTP dashboard / ops JSON API
    environment:
      # Maps to -Dkiradb.node.id, read by KiraDBServer.resolveNodeId().
      # Only affects CRDT slot ownership on this single node — it does not
      # register the node with any peer.
      JAVA_OPTS: "-Dkiradb.data.dir=/data -Dkiradb.node.id=kiradb-1"
    volumes:
      - kiradb-data:/data

volumes:
  kiradb-data:

